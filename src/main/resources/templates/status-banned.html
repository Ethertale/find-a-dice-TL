<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <style>
        h1, h2, h3 {
            color: #d3a862;
        }
    </style>
    <title>R&D - Banned</title>
</head>
<body>

<div style="height: 90vh" class="container text-center d-flex flex-column justify-content-center align-items-center">
    <div th:if="${loggedUser.accountStatus.toString() == 'BANNED'}" class="container">
        <h1>You are banished.</h1>
        <h3>You can appeal at info@galin-yan.com</h3>

        <div class="container">
            <p th:text="'Your profile ID: ' + ${loggedUser.id}"></p>
            <p th:text="'Username: ' + ${loggedUser.username}"></p>
        </div>

        <form action="/logout" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
    <div th:unless="${loggedUser.accountStatus.toString() == 'BANNED'}" class="container">
        <h1 th:text="'You are not banished, don\'t worry ' + ${loggedUser.username} + '. 😉'" ></h1>
        <div style="display: none">
            <audio id="audio1" src="/icandothat.mp3" controls preload="auto"></audio>
        </div>
        <a id="goBackButton"><button onclick="EvalSound()" class="btn btn-primary">Go back.</button></a>
    </div>
</div>

<script>
    function EvalSound() {
        let thisSound = document.getElementById('audio1');
        thisSound.play();
        setTimeout(function() {
            window.location.href = '/home';
        }, 1000);
    }
    document.getElementById("goBackButton").onclick = function () {
        console.log('Thank you for visiting! Just so you know... THE CAKE IS A LIE!');
    }
</script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
